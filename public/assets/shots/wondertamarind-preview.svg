<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Dummy preview of Wonder Tamarind (not public): a tamarind exporter's company profile. Not a screenshot. -->
  <rect width="1000" height="750" fill="#fbf6ef"/>
  <rect width="1000" height="72" fill="#3b2416"/>
  <circle cx="58" cy="36" r="15" fill="#c98b4a"/>
