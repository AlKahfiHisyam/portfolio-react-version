  <text x="135" y="328" font-size="16" font-weight="600" fill="#2a170c" text-anchor="middle">Our products</text>
  <g fill="#8a5a36">
    <path d="M640 150 q90 -40 170 10 q-20 40 -80 40 q-60 0 -90 -50z"/>
    <path d="M620 250 q110 -30 210 30 q-40 40 -110 30 q-70 -10 -100 -60z" fill="#a66d41"/>
    <path d="M700 330 q80 -20 150 20 q-30 30 -80 25 q-50 -5 -70 -45z" fill="#7a4b2b"/>
  </g>

  <text x="50" y="460" font-size="24" font-weight="700" fill="#3b2416">Products</text>
  <g>
    <rect x="50" y="485" width="280" height="215" rx="16" fill="#ffffff" stroke="#eadccb"/>
    <rect x="70" y="505" width="240" height="120" rx="10" fill="#f0dcc4"/>
