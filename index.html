    <!-- Apply the saved or system theme before first paint -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme-choice'); } catch (e) {}
        // The daytime terminal is the default look; a visitor's own choice from the toggle wins.
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.add('js');
        try { var l = localStorage.getItem('lang'); if (l === 'id' || l === 'en') document.documentElement.lang = l; } catch (e) {}
      })();
    </script>
